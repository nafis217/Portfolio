<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#17232D"/>
  <!-- Matrix / BERT tensor visual overlay -->
  <rect x="40" y="40" width="720" height="420" rx="10" fill="#1D2933" stroke="#2A3A47" stroke-width="1.5"/>
  <text x="70" y="85" font-family="monospace" font-size="14" fill="#8FA79A" font-weight="700">BERT Transformer Classifier // NLP Pipeline</text>
  <line x1="70" y1="105" x2="730" y2="105" stroke="#2A3A47" stroke-width="1"/>

  <!-- Attention weights visualization grid -->
  <g fill="none" stroke="#536D7A" stroke-width="1">
    <rect x="70" y="130" width="300" height="280" rx="6" stroke="#2A3A47"/>
  </g>
  <text x="90" y="160" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Contextual Token Representation</text>
  
  <rect x="90" y="180" width="260" height="30" rx="4" fill="#17232D" stroke="#536D7A"/>
  <text x="100" y="200" font-family="monospace" font-size="11" fill="#C8BCA8">[CLS] Claim Verification Transformer [SEP]</text>

  <rect x="90" y="225" width="260" height="120" rx="4" fill="#17232D" stroke="#2A3A47"/>
  <text x="105" y="250" font-family="monospace" font-size="11" fill="#8FA79A">Precision: 0.94</text>
  <text x="105" y="275" font-family="monospace" font-size="11" fill="#8FA79A">Recall:    0.92</text>
  <text x="105" y="300" font-family="monospace" font-size="11" fill="#8FA79A">F1-Score:  0.93</text>
  <text x="105" y="325" font-family="monospace" font-size="11" fill="#8FA79A">Loss:      0.0812</text>

  <!-- Tensor weights chart right side -->
  <rect x="400" y="130" width="330" height="280" rx="6" fill="#17232D" stroke="#2A3A47"/>
  <text x="420" y="160" font-family="sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Model Confusion Matrix</text>

  <rect x="420" y="180" width="140" height="100" rx="4" fill="#536D7A" opacity="0.4"/>
  <text x="450" y="235" font-family="sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">True Authentic</text>

  <rect x="570" y="180" width="140" height="100" rx="4" fill="#2A3A47"/>
  <text x="600" y="235" font-family="sans-serif" font-size="14" fill="#66727D">False Pos</text>

  <rect x="420" y="290" width="140" height="100" rx="4" fill="#2A3A47"/>
  <text x="450" y="345" font-family="sans-serif" font-size="14" fill="#66727D">False Neg</text>

  <rect x="570" y="290" width="140" height="100" rx="4" fill="#8FA79A" opacity="0.5"/>
  <text x="600" y="345" font-family="sans-serif" font-size="18" fill="#FFFFFF" font-weight="700">True Fake</text>
</svg>
