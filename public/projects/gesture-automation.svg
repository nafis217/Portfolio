<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F6F6F2"/>
  <!-- Computer Vision Frame -->
  <rect x="40" y="40" width="460" height="420" rx="10" fill="#17232D" stroke="#DDE2E4" stroke-width="2"/>
  <!-- Hand Landmark Lines Mockup -->
  <polyline points="200,380 220,320 200,240 180,180" stroke="#8FA79A" stroke-width="3" fill="none"/>
  <polyline points="220,320 250,230 250,150" stroke="#8FA79A" stroke-width="3" fill="none"/>
  <polyline points="220,320 290,240 300,160" stroke="#8FA79A" stroke-width="3" fill="none"/>
  <polyline points="220,320 330,260 340,200" stroke="#8FA79A" stroke-width="3" fill="none"/>

  <circle cx="180" cy="180" r="6" fill="#FFFFFF"/>
  <circle cx="250" cy="150" r="6" fill="#FFFFFF"/>
  <circle cx="300" cy="160" r="6" fill="#FFFFFF"/>
  <circle cx="340" cy="200" r="6" fill="#FFFFFF"/>

  <rect x="60" y="60" width="220" height="32" rx="4" fill="#536D7A"/>
  <text x="75" y="81" font-family="monospace" font-size="12" fill="#FFFFFF">Gesture Recognized: [OPEN_PALM]</text>

  <!-- Right side MQTT control nodes -->
  <rect x="520" y="40" width="240" height="420" rx="10" fill="#FFFFFF" stroke="#DDE2E4" stroke-width="2"/>
  <text x="540" y="80" font-family="sans-serif" font-size="14" font-weight="700" fill="#17232D">MQTT Telemetry Broker</text>
  
  <rect x="540" y="110" width="200" height="70" rx="8" fill="#EEF1F2"/>
  <text x="555" y="135" font-family="sans-serif" font-size="11" fill="#66727D">TOPIC: home/lighting</text>
  <text x="555" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#8FA79A">STATE: ACTIVE 100%</text>

  <rect x="540" y="195" width="200" height="70" rx="8" fill="#EEF1F2"/>
  <text x="555" y="220" font-family="sans-serif" font-size="11" fill="#66727D">TOPIC: home/hvac</text>
  <text x="555" y="245" font-family="sans-serif" font-size="14" font-weight="700" fill="#536D7A">TEMP SET: 22°C</text>

  <rect x="540" y="280" width="200" height="70" rx="8" fill="#EEF1F2"/>
  <text x="555" y="305" font-family="sans-serif" font-size="11" fill="#66727D">LATENCY</text>
  <text x="555" y="330" font-family="sans-serif" font-size="14" font-weight="700" fill="#17232D">12ms Response</text>
</svg>
