  <rect x="620" y="275" width="80" height="12" rx="3" fill="#FFB92E"/>

  <rect x="255" y="305" width="160" height="12" rx="3" fill="#CDEAF4"/>
  <rect x="420" y="305" width="110" height="12" rx="3" fill="#79B98B"/>
  <rect x="620" y="305" width="70" height="12" rx="3" fill="#FFB92E"/>
