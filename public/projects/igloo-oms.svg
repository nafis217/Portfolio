  </defs>
  <rect width="800" height="500" fill="url(#omsGrad)"/>
  
  <!-- Dashboard Main Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#FFFFFF" stroke="#1676A8" stroke-width="2"/>
  
  <!-- Top Navigation -->
  <rect x="60" y="60" width="680" height="44" rx="8" fill="#172432"/>
  <circle cx="85" cy="82" r="6" fill="#FFB92E"/>
  <circle cx="105" cy="82" r="6" fill="#FF7A45"/>
  <circle cx="125" cy="82" r="6" fill="#79B98B"/>
  <text x="150" y="87" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">IGLOO OMS // Enterprise Order Management System</text>
  
  <!-- Left Sidebar -->
  <rect x="60" y="116" width="160" height="324" rx="8" fill="#FFF8EC" stroke="#1676A8" stroke-opacity="0.2"/>
  <rect x="75" y="135" width="130" height="28" rx="6" fill="#1676A8"/>
  <text x="95" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">Orders Queue</text>
  <rect x="75" y="173" width="130" height="24" rx="5" fill="#EAF6FA"/>
  <rect x="75" y="207" width="130" height="24" rx="5" fill="#EAF6FA"/>
  <rect x="75" y="241" width="130" height="24" rx="5" fill="#EAF6FA"/>

