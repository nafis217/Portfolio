  <text x="255" y="180" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#172432">42 Active Routes</text>

  <!-- Table Mockup -->
  <rect x="235" y="220" width="505" height="220" rx="8" fill="#FFFFFF" stroke="#1676A8" stroke-opacity="0.2"/>
  <line x1="235" y1="255" x2="740" y2="255" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="255" y="243" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#172432">Recent Distributor Orders</text>
  
  <rect x="255" y="275" width="140" height="12" rx="3" fill="#CDEAF4"/>
