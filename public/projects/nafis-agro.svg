  <text x="310" y="185" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#203229">Regional Logistics</text>

  <rect x="520" y="120" width="220" height="100" rx="8" fill="#FFF8EC" stroke="#FFB92E"/>
