  <rect x="80" y="300" width="180" height="12" rx="3" fill="#DAF0DE"/>
  <rect x="280" y="300" width="120" height="12" rx="3" fill="#79B98B"/>
  <rect x="600" y="300" width="100" height="12" rx="3" fill="#FFB92E"/>

  <rect x="80" y="335" width="200" height="12" rx="3" fill="#DAF0DE"/>
