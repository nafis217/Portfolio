  </defs>
  <rect width="800" height="500" fill="url(#agroGrad)"/>
  
  <!-- Dashboard Main Frame -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#FFFFFF" stroke="#478B5A" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="60" y="60" width="680" height="44" rx="8" fill="#203229"/>
  <circle cx="85" cy="82" r="6" fill="#79B98B"/>
  <circle cx="105" cy="82" r="6" fill="#FFB92E"/>
  <circle cx="125" cy="82" r="6" fill="#FF7A45"/>
  <text x="150" y="87" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700">NAFIS AGRO // Supply Chain &amp; B2B Trading Platform</text>
  
  <!-- Farm Yield Stats Cards -->
  <rect x="60" y="120" width="210" height="100" rx="8" fill="#F0F9F2" stroke="#478B5A" stroke-opacity="0.3"/>
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#478B5A">CROP YIELD TELEMETRY</text>
  <text x="80" y="185" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#203229">Verified Harvests</text>

  <rect x="290" y="120" width="210" height="100" rx="8" fill="#F0F9F2" stroke="#478B5A" stroke-opacity="0.3"/>
