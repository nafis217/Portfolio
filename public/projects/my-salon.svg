<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F2"/>
      <stop offset="100%" stop-color="#EEF1F2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <!-- Top bar -->
  <rect x="40" y="40" width="720" height="50" rx="8" fill="url(#cardGrad)" stroke="#DDE2E4" stroke-width="1.5"/>
  <circle cx="70" cy="65" r="6" fill="#536D7A"/>
  <circle cx="90" cy="65" r="6" fill="#8FA79A"/>
  <circle cx="110" cy="65" r="6" fill="#C8BCA8"/>
  <rect x="140" y="55" width="220" height="20" rx="4" fill="#EEF1F2"/>
  <text x="150" y="69" font-family="system-ui, sans-serif" font-size="11" fill="#536D7A" font-weight="600">app.my-salon.com / tenant-dashboard</text>
  
  <!-- Sidebar -->
  <rect x="40" y="100" width="180" height="360" rx="8" fill="url(#cardGrad)" stroke="#DDE2E4" stroke-width="1.5"/>
  <rect x="60" y="130" width="140" height="12" rx="3" fill="#17232D"/>
  <rect x="60" y="160" width="140" height="32" rx="6" fill="#536D7A"/>
  <text x="90" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF" font-weight="500">Bookings Queue</text>
  <rect x="60" y="204" width="140" height="28" rx="6" fill="#EEF1F2"/>
  <rect x="60" y="240" width="140" height="28" rx="6" fill="#EEF1F2"/>
  <rect x="60" y="276" width="140" height="28" rx="6" fill="#EEF1F2"/>
  <rect x="60" y="312" width="140" height="28" rx="6" fill="#EEF1F2"/>

  <!-- Main Content Dashboard -->
  <rect x="235" y="100" width="525" height="360" rx="8" fill="url(#cardGrad)" stroke="#DDE2E4" stroke-width="1.5"/>
  <!-- Stat boxes -->
  <rect x="255" y="120" width="150" height="80" rx="6" fill="#F6F6F2" stroke="#DDE2E4"/>
  <text x="270" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#66727D">WALK-IN QUEUE</text>
  <text x="270" y="175" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#17232D">18 Active</text>

  <rect x="420" y="120" width="150" height="80" rx="6" fill="#F6F6F2" stroke="#DDE2E4"/>
  <text x="435" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#66727D">POS TRANSACTIONS</text>
  <text x="435" y="175" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#536D7A">SSLCOMMERZ</text>

  <rect x="585" y="120" width="155" height="80" rx="6" fill="#F6F6F2" stroke="#DDE2E4"/>
  <text x="600" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#66727D">TENANT STATUS</text>
  <text x="600" y="175" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#8FA79A">Isolated DB</text>

  <!-- Table mockup -->
  <rect x="255" y="220" width="485" height="220" rx="6" fill="#FFFFFF" stroke="#DDE2E4"/>
  <line x1="255" y1="260" x2="740" y2="260" stroke="#DDE2E4" stroke-width="1"/>
  <text x="275" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#17232D">Live Stylist Appointments</text>
  
  <rect x="275" y="280" width="120" height="12" rx="3" fill="#EEF1F2"/>
  <rect x="420" y="280" width="80" height="12" rx="3" fill="#8FA79A" opacity="0.4"/>
  <rect x="620" y="280" width="90" height="12" rx="3" fill="#536D7A" opacity="0.3"/>

  <rect x="275" y="310" width="140" height="12" rx="3" fill="#EEF1F2"/>
  <rect x="420" y="310" width="100" height="12" rx="3" fill="#8FA79A" opacity="0.4"/>
  <rect x="620" y="310" width="70" height="12" rx="3" fill="#536D7A" opacity="0.3"/>

  <rect x="275" y="340" width="110" height="12" rx="3" fill="#EEF1F2"/>
  <rect x="420" y="340" width="70" height="12" rx="3" fill="#8FA79A" opacity="0.4"/>
  <rect x="620" y="340" width="85" height="12" rx="3" fill="#536D7A" opacity="0.3"/>
</svg>
