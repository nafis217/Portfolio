<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF1F2"/>
      <stop offset="100%" stop-color="#F6F6F2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <!-- Device mockup container -->
  <rect x="50" y="40" width="460" height="420" rx="12" fill="#FFFFFF" stroke="#DDE2E4" stroke-width="2"/>
  <rect x="70" y="70" width="420" height="40" rx="6" fill="#F6F6F2" stroke="#DDE2E4"/>
  <text x="90" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#17232D">IglooTrack / Freezer Telemetry Control</text>

  <!-- Telemetry Line Graph -->
  <rect x="70" y="130" width="420" height="200" rx="8" fill="#17232D"/>
  <!-- Grid lines -->
  <line x1="70" y1="180" x2="490" y2="180" stroke="#2A3A47" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="230" x2="490" y2="230" stroke="#2A3A47" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="70" y1="280" x2="490" y2="280" stroke="#2A3A47" stroke-width="1" stroke-dasharray="4,4"/>

  <polyline points="80,260 130,240 180,270 230,200 280,220 330,170 380,190 430,160 480,180" fill="none" stroke="#8FA79A" stroke-width="3"/>
  <circle cx="330" cy="170" r="5" fill="#FFFFFF" stroke="#536D7A" stroke-width="2"/>
  <text x="345" y="165" font-family="monospace" font-size="11" fill="#FFFFFF">-18.4°C [OPTIMAL]</text>

  <!-- Mobile phone mockup overlay -->
  <rect x="540" y="60" width="200" height="380" rx="24" fill="#FFFFFF" stroke="#17232D" stroke-width="4"/>
  <rect x="600" y="70" width="80" height="14" rx="7" fill="#EEF1F2"/>
  <rect x="560" y="100" width="160" height="50" rx="8" fill="#536D7A"/>
  <text x="575" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Expo / React Native</text>
  <text x="575" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#EAEFEF">Real-time alerts active</text>

  <rect x="560" y="160" width="160" height="60" rx="8" fill="#F6F6F2" stroke="#DDE2E4"/>
  <rect x="560" y="230" width="160" height="60" rx="8" fill="#F6F6F2" stroke="#DDE2E4"/>
  <rect x="560" y="300" width="160" height="60" rx="8" fill="#F6F6F2" stroke="#DDE2E4"/>
</svg>
